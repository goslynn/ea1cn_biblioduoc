# Valores de mentira para los tests. En AWS los inyecta aws/backend.yaml desde
# los Outputs de cognito.yaml y web.yaml; aqui solo hacen falta para que el
# contexto de Spring levante. Ningun test llega a usar el JwtDecoder de verdad:
# la autenticacion se simula con el post-processor jwt() de spring-security-test,
# y por eso tampoco hay ninguna llamada de red.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_pruebas
biblioteca.scope=biblioteca-api/acceso
biblioteca.origen=https://biblioteca-web-000000000000.s3.us-east-1.amazonaws.com
